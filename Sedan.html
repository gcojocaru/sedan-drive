<style>
html,body{margin:0;height:100%;overflow:hidden;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif}
three-d-stage:not(:defined){visibility:hidden}
three-d-stage{transition:--stage-bg .4s}
#panel{position:fixed;top:16px;left:16px;display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:12px;background:rgba(255,255,255,.86);backdrop-filter:blur(8px);box-shadow:0 1px 0 rgba(0,0,0,.06),0 6px 24px rgba(0,0,0,.08);color:#1d1d1f;max-width:calc(100vw - 32px);box-sizing:border-box;transition:background .3s,color .3s}
#panel.night{background:rgba(22,24,28,.86);color:#ececec;box-shadow:0 6px 24px rgba(0,0,0,.4)}
#panel h2{margin:0;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;opacity:.6}
.row{display:flex;flex-wrap:wrap;gap:6px}
#panel button{display:flex;align-items:center;gap:6px;font:inherit;font-size:13px;padding:7px 11px;border-radius:8px;border:1px solid rgba(0,0,0,.14);background:transparent;color:inherit;cursor:pointer}
#panel.night button{border-color:rgba(255,255,255,.18)}
#panel button[aria-pressed="true"]{background:#1d1d1f;color:#fff;border-color:#1d1d1f}
#panel.night button[aria-pressed="true"]{background:#f2f2f2;color:#141414;border-color:#f2f2f2}
#panel button kbd{font:inherit;font-size:10px;opacity:.5}
[data-app-version]{font-size:12px;opacity:.8}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.25}
.dot.on{background:#ff9a1a;opacity:1}
</style>
</head><body>
<three-d-stage name="compact-sedan"></three-d-stage>
<div id="panel">
  <h2>Lights</h2>
  <div class="row">
    <button data-k="beam">Headlights: <span id="beamLbl">Off</span> <kbd>H</kbd></button>
    <button data-k="fog">Fog <kbd>F</kbd></button>
    <button data-k="brake">Brake <kbd>B</kbd></button>
    <button data-k="reverse">Reverse <kbd>R</kbd></button>
  </div>
  <div class="row">
    <button data-k="left"><span class="dot" id="dotL"></span>Left <kbd>←</kbd></button>
    <button data-k="hazard">Hazard <kbd>X</kbd></button>
    <button data-k="right">Right<span class="dot" id="dotR"></span> <kbd>→</kbd></button>
  </div>
  <div class="row">
    <button data-k="cabin">Cabin light <kbd>C</kbd></button>
    <button data-k="night">Night scene <kbd>N</kbd></button>
    <button data-k="under">Underside view <kbd>U</kbd></button>
    <button data-k="inside">Interior view <kbd>I</kbd></button>
  </div>
  <small data-app-version hidden>Version <span></span></small>
</div>
<script src="three-d-stage.js"></script>
<script type="module" src="sedan-viewer.js"></script>
